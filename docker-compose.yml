services:
  db:
    image: postgres:16
    container_name: enervision-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: enervision
      POSTGRES_PASSWORD: enervision_dev_password
      POSTGRES_DB: enervision_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: