services:
  db:
    image: postgres:16
    container_name: enervision-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: enervision
      POSTGRES_PASSWORD: enervision_dev_password
      POSTGRES_DB: enervision_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: enervision-api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://enervision:enervision_dev_password@db:5432/enervision_db
    ports:
      - "8000:8000"

volumes:
  pgdata: